<style>
:root{--bg:#121212;--panel:#1a1a1a;--panel2:#252525;--line:#303030;--fg:#ececec;--mute:#8f8f8f;--pri:#f2f2f2;--prifg:#111;--acc:#4a4a4a;--accfg:#ffffff;--hl:#ffffff;--sfill:#4a4a4a;--sedge:#ffffff;--bad:#ff8a73;--sel:#4b9cff;--guide:#ff5b8a;--cbg:#1f1f1f;--chk:repeating-conic-gradient(#5a5a5a 0 25%,#3a3a3a 0 50%) 0 0/8px 8px;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--sans);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hl);outline-offset:1px}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg);font-weight:600}
button.pri:hover{border-color:var(--pri);background:#fff}
button:disabled{opacity:.45;cursor:default}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0;width:100%}
input[type=color]{width:28px;height:26px;padding:0 2px;background:var(--bg);border:1px solid var(--line);border-radius:5px;flex:none}
#top{display:flex;align-items:center;gap:6px;padding:0 10px;min-height:38px;background:var(--panel);border-bottom:1px solid var(--line)}
.menus{display:flex;align-items:center;margin-left:8px}.mn{position:relative}
.mt{background:none;border:0;border-radius:4px;padding:4px 9px}.mt:hover,.mn.on .mt{background:var(--panel2)}
.dd{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:40;min-width:210px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.mn.on .dd{display:flex;flex-direction:column}
.dd button{background:none;border:0;border-radius:4px;text-align:left;padding:6px 10px}.dd button:hover{background:#363636}
.dd hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.dd button.cur::before{content:'✓ '}
.brand svg{height:30px;width:auto;display:block}
.ic{display:inline-grid;place-items:center;padding:5px 8px}.ic svg,.ls svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pname{max-width:240px;width:auto;flex:0 1 200px;text-align:left;margin-left:8px;background:transparent;border-color:transparent;color:var(--mute)}#pname:hover,#pname:focus{border-color:var(--line);color:var(--fg)}
.sp{flex:1}
#bExport{padding:4px 14px}
#mid{display:grid;grid-template-columns:240px minmax(0,1fr) 264px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#lay{border-right:1px solid var(--line);display:flex;flex-direction:column}
#inspW{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#insp{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto;background:var(--panel)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.ph button{text-transform:none;letter-spacing:0;font-size:12px;padding:3px 9px}
#layList{flex:1;padding:0 6px 10px;position:relative}
.lr{display:flex;align-items:center;gap:5px;height:28px;padding-right:4px;border-radius:5px;cursor:default;user-select:none;-webkit-user-select:none}
.lr:hover{background:var(--panel2)}.lr.on{background:#2d3a4d}.lr.off .ln,.lr.off .ls{opacity:.45}
.lr .cx,.lr .cx0{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--mute)}
.lr .cx::before{content:'';border:4px solid transparent;border-left:5px solid currentColor;border-right:0;transform:translateX(2px)}.lr .cx.o::before{transform:rotate(90deg) translateX(2px)}
.ls{flex:none;color:var(--mute);display:grid}.ls svg{width:13px;height:13px;stroke-width:1.8}.lr.on .ls{color:var(--fg)}
.ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln input{height:22px;padding:1px 4px}
.lb{background:none;border:0;padding:2px;color:var(--mute);display:none}.lb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.lr:hover .lb,.lb.set{display:block}.lb:hover{color:var(--fg)}
#dropLn{position:absolute;left:6px;right:6px;height:2px;background:var(--sel);pointer-events:none}

<script>
const $=id=>document.getElementById(id);
const V=$('view'),W=$('world'),UI=$('ui'),TED=$('ted'),LL=$('layList');
let LANG='en';try{LANG=localStorage.getItem('cv-lang')||(/^ru/i.test(navigator.language)?'ru':'en')}catch(e){}
const L=(e,r)=>LANG==='ru'?r:e;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=v=>Math.round(v*100)/100;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const plu=(n,a,b,c)=>LANG!=='ru'?(n===1?a:b):(n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c);
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}

let doc={name:'',nodes:[]},ASSETS={};
let distort=null,sel=[],tool='move',view={x:80,y:80,z:1},scope=null,editPath=null,pen=null,editing=null,hover=null,drag=null,ldrag=null,space=false,mouse={x:0,y:0},fileH=null,actPt=-1,renaming=false;
const IDX=new Map();
const nid=()=>Math.random().toString(36).slice(2,10);
const rep=(k,v)=>k[0]==='_'?undefined:v;
const clone=o=>JSON.parse(JSON.stringify(o,rep));

function reindex(){IDX.clear();const w=(l,p)=>{for(const n of l){IDX.set(n.id,{n,p});if(n.children)w(n.children,n)}};w(doc.nodes,null);sel=sel.map(n=>IDX.get(n.id)?.n).filter(Boolean);if(scope&&!IDX.has(scope))scope=null}
const par=n=>IDX.get(n.id)?.p||null;
const sibs=n=>{const p=par(n);return p?p.children:doc.nodes};
const isCont=n=>n.type==='frame'||n.type==='group'||n.type==='bool';
function anc(n,a){for(let p=par(n);p;p=par(p))if(p===a)return true;return false}
const topSel=()=>sel.filter(n=>!sel.some(m=>m!==n&&anc(n,m)));
function walk(f,l=doc.nodes){for(const n of l){f(n);if(n.children)walk(f,n.children)}}
const leaves=l=>l.flatMap(n=>n.type==='group'?leaves(n.children):[n]);
function detach(n){const l=sibs(n),i=l.indexOf(n);if(i>=0)l.splice(i,1)}
function prune(l=doc.nodes){for(let i=l.length-1;i>=0;i--){const n=l[i];if(n.children){prune(n.children);if(n.type==='group'&&!n.children.length)l.splice(i,1)}}}

function corners(n){const cx=n.x+n.w/2,cy=n.y+n.h/2,t=(n.rot||0)*Math.PI/180,c=Math.cos(t),s=Math.sin(t);return[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>{const x=a*n.w/2,y=b*n.h/2;return[cx+x*c-y*s,cy+x*s+y*c]})}
function union(bs){bs=bs.filter(Boolean);if(!bs.length)return null;let x=1/0,y=1/0,X=-1/0,Y=-1/0;for(const b of bs){x=Math.min(x,b.x);y=Math.min(y,b.y);X=Math.max(X,b.x+b.w);Y=Math.max(Y,b.y+b.h)}return{x,y,w:X-x,h:Y-y}}
function aabb(n){if(n.type==='bool')return boolGeo(n)?.b||null;if(n.mask&&n.children[0]&&!n.children[0].hid)return aabb(n.children[0]);if(n.dq){const P=n.dq.map(([x,y])=>l2w(n,x,y)),xs=P.map(q=>q[0]),ys=P.map(q=>q[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}if(n.type==='group')return union(n.children.filter(c=>!c.hid).map(aabb));if(!n.rot)return{x:n.x,y:n.y,w:n.w,h:n.h};const p=corners(n),xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}
const selBox=()=>union(topSel().map(aabb));
const inBox=(p,b)=>b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
const touch=(a,b)=>a.x<=b.x+b.w&&b.x<=a.x+a.w&&a.y<=b.y+b.h&&b.y<=a.y+a.h;
const nrm=a=>r2(((a+180)%360+360)%360-180);

function moveN(n,dx,dy){if(n.tp)return;if(n.type!=='group'){n.x+=dx;n.y+=dy}if(n.children)n.children.forEach(c=>moveN(c,dx,dy))}
function setBox(n,x,y,w,h){
 if(n.type==='path'){if(n.w<=.01)w=n.w;if(n.h<=.01)h=n.h;const sx=n.w>.01?w/n.w:1,sy=n.h>.01?h/n.h:1;for(const S of subs(n))for(const p of S.pts){p.x*=sx;p.y*=sy;p.ix*=sx;p.iy*=sy;p.ox*=sx;p.oy*=sy}}
 if(n.type==='text'){n.fixW=true;if(n.fixH)n.hh=h;else h=n.h}
 if(n.dq){const kx=n.w>.01?w/n.w:1,ky=n.h>.01?h/n.h:1;n.dq=n.dq.map(([x,y])=>[x*kx,y*ky])}
 Object.assign(n,{x,y,w,h})}
function scaleN(n,fb,tb,k){const sx=fb.w>.01?tb.w/fb.w:1,sy=fb.h>.01?tb.h/fb.h:1;
 if(isGrp(n)){n.children.forEach(c=>scaleN(c,fb,tb,k));return}
 const cx=tb.x+(n.x+n.w/2-fb.x)*sx,cy=tb.y+(n.y+n.h/2-fb.y)*sy;
 if(n.type==='text'){const ow=n.w,oh=n.h;n.fs=Math.max(1,r2(n.fs*k));if(n.ls)n.ls=r2(n.ls*k);if(n.fixW)n.w*=sx;if(n.fixH&&n.hh)n.hh*=sy;layoutT(n);if(n.dq)n.dq=n.dq.map(([x,y])=>[x*n.w/ow,y*n.h/oh]);n.x=cx-n.w/2;n.y=cy-n.h/2;return}
 const w=n.w*sx,h=n.h*sy;setBox(n,cx-w/2,cy-h/2,w,h);n.x=cx-n.w/2;n.y=cy-n.h/2;
 if(n.children)n.children.forEach(c=>scaleN(c,fb,tb,k))}
function rotN(n,c,a){if(isGrp(n)){n.children.forEach(k=>rotN(k,c,a));return}if(n.type==='frame')return;
 const t=a*Math.PI/180,cs=Math.cos(t),sn=Math.sin(t),x=n.x+n.w/2-c.x,y=n.y+n.h/2-c.y;
 n.x=c.x+x*cs-y*sn-n.w/2;n.y=c.y+x*sn+y*cs-n.h/2;n.rot=nrm((n.rot||0)+a)}
function flipN(n,c,hz){if(n.children){n.children.forEach(k=>flipN(k,c,hz));if(isGrp(n))return}
 if(hz)n.x=2*c.x-n.x-n.w;else n.y=2*c.y-n.y-n.h;
 if(n.type==='frame')return;
 if(n.type==='path')for(const S of subs(n))for(const p of S.pts){if(hz){p.x=n.w-p.x;p.ix=-p.ix;p.ox=-p.ox}else{p.y=n.h-p.y;p.iy=-p.iy;p.oy=-p.oy}}
 else if(n.type==='text'||n.type==='image'){if(hz)n.fx=!n.fx;else n.fy=!n.fy}
 if(n.rot)n.rot=-n.rot}

const TC=document.createElement('canvas').getContext('2d');
const fnt=(n,z=1)=>`${n.fw||400} ${n.fs*z}px ${ffCss(n.ff)}`;
/*layoutT moved*/

function bbP(P,closed){const xs=[],ys=[];const seg=(a,b)=>{for(let i=1;i<16;i++){const t=i/16,u=1-t,c0=u*u*u,c1=3*u*u*t,c2=3*u*t*t,c3=t*t*t;xs.push(c0*a.x+c1*(a.x+a.ox)+c2*(b.x+b.ix)+c3*b.x);ys.push(c0*a.y+c1*(a.y+a.oy)+c2*(b.y+b.iy)+c3*b.y)}};
 P.forEach(p=>{xs.push(p.x);ys.push(p.y)});for(let i=1;i<P.length;i++)seg(P[i-1],P[i]);if(closed&&P.length>2)seg(P[P.length-1],P[0]);
 const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}
function pathFrom(P,closed){const b=bbP(P,closed);return{x:b.x,y:b.y,w:b.w,h:b.h,closed,pts:P.map(p=>({...p,x:p.x-b.x,y:p.y-b.y}))}}
const pathD=n=>subsD(rsubs(n),n.x,n.y);
function l2w(n,x,y){const cx=n.w/2,cy=n.h/2,t=(n.rot||0)*Math.PI/180,c=Math.cos(t),s=Math.sin(t),dx=x-cx,dy=y-cy;return[n.x+cx+dx*c-dy*s,n.y+cy+dx*s+dy*c]}
function w2l(n,p){const cx=n.w/2,cy=n.h/2,t=-(n.rot||0)*Math.PI/180,c=Math.cos(t),s=Math.sin(t),dx=p.x-n.x-cx,dy=p.y-n.y-cy;return{x:cx+dx*c-dy*s,y:cy+dx*s+dy*c}}
function normPath(n){const b=bbS(subs(n));if(Math.abs(b.x)<.01&&Math.abs(b.y)<.01&&Math.abs(b.w-n.w)<.01&&Math.abs(b.h-n.h)<.01)return;
 const t=(n.rot||0)*Math.PI/180,ox=b.x+b.w/2-n.w/2,oy=b.y+b.h/2-n.h/2,cx=n.x+n.w/2+ox*Math.cos(t)-oy*Math.sin(t),cy=n.y+n.h/2+ox*Math.sin(t)+oy*Math.cos(t);
 for(const S of subs(n))for(const p of S.pts){p.x-=b.x;p.y-=b.y}Object.assign(n,{w:b.w,h:b.h,x:cx-b.w/2,y:cy-b.h/2})}

function xf(n){if(!n.rot&&!n.fx&&!n.fy)return'';const cx=r2(n.x+n.w/2),cy=r2(n.y+n.h/2);return` transform="translate(${cx} ${cy})${n.rot?` rotate(${n.rot})`:''}${n.fx||n.fy?` scale(${n.fx?-1:1} ${n.fy?-1:1})`:''} translate(${-cx} ${-cy})"`}
const pnt=n=>` fill="${fa(n)}"`+(n.stroke&&n.sw>0?` stroke="${n.stroke}" stroke-width="${n.sw}"`:'');
const opa=n=>n.op!=null&&n.op<1?` opacity="${n.op}"`:'';
const rxOf=n=>n.r?` rx="${r2(Math.min(n.r,n.w/2,n.h/2))}"`:'';

const w2s=(x,y)=>[r2(x*view.z+view.x),r2(y*view.z+view.y)];
function toW(e){const r=V.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.z,y:(e.clientY-r.top-view.y)/view.z}}
const vc=()=>{const r=V.getBoundingClientRect();return{x:(r.width/2-view.x)/view.z,y:(r.height/2-view.y)/view.z}};
const poly=(P,ex='')=>`<polygon points="${P.map(p=>w2s(...p).join(',')).join(' ')}" fill="none" stroke="var(--sel)"${ex}/>`;
const bpts=b=>[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]];
function outline(n,w){if(n.dq)return poly(n.dq.map(([x,y])=>l2w(n,x,y)),` stroke-width="${w}"`);const st=` fill="none" stroke="var(--sel)" stroke-width="${w}" vector-effect="non-scaling-stroke"`,g=s=>`<g transform="translate(${view.x} ${view.y}) scale(${view.z})">${s}</g>`;
 if(n.type==='bool'){const g=boolGeo(n);return g?`<g transform="translate(${view.x} ${view.y}) scale(${view.z})"><path d="${g.d}"${st}/></g>`:''}
 if(n.type==='group'){const b=aabb(n);return b?poly(bpts(b),` stroke-width="${w}"`):''}
 if(n.type==='ellipse')return g(`<ellipse cx="${n.x+n.w/2}" cy="${n.y+n.h/2}" rx="${n.w/2}" ry="${n.h/2}"${st}${xf(n)}/>`);
 if(n.type==='path')return g(`<path d="${pathD(n)}"${st}${xf(n)}/>`);
 if(n.type==='poly'||n.type==='star')return g(`<path d="${shD(n)}"${st}${xf(n)}/>`);
 if(/rect|image/.test(n.type)&&rcOf(n).some(v=>v>0))return g(rshape(n,st+xf(n)));
 return poly(corners(n),` stroke-width="${w}"`)}

function drawUI(){if(!gx)return drawUI0();const cv=view;view=gx.v0;try{drawUI0()}finally{view=cv}}
function drawUI0(){let s='';const z=view.z,hs=matchMedia('(pointer:coarse)').matches?8:4;
 {const FL=[];const scan=(l,inS)=>{for(const f of l)if(f.type==='frame'&&!f.hid){FL.push(f);if(f.sec)scan(f.children,1)}};scan(doc.nodes,0);for(const f of FL){const[x,y]=w2s(f.x,f.y);if(f.sec){const mx=Math.max(0,(f.w*z-24)/7|0);let t=nm(f);if(t.length>mx)t=mx>2?t.slice(0,mx-1)+'…':'';if(!t)continue;const tw=t.length*7+18;s+=`<g class="secL${sel.includes(f)?' on':''}" data-h="fl" data-f="${f.id}"><rect data-h="fl" data-f="${f.id}" x="${x+8}" y="${y+8}" width="${tw}" height="22" rx="7"/><text data-h="fl" data-f="${f.id}" x="${x+17}" y="${y+23}">${esc(t)}</text></g>`;continue}const mx=Math.max(0,f.w*z/6.4|0);let t=nm(f);if(t.length>mx)t=mx>2?t.slice(0,mx-1)+'…':'';s+=`<text class="fl${sel.includes(f)?' on':''}" data-h="fl" data-f="${f.id}" x="${x}" y="${y-6}">${esc(t)}</text>`}}
