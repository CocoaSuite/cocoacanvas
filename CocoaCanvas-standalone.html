<style>
:root{--bg:#121212;--panel:#1a1a1a;--panel2:#252525;--line:#303030;--fg:#ececec;--mute:#8f8f8f;--pri:#f2f2f2;--prifg:#111;--acc:#4a4a4a;--accfg:#ffffff;--hl:#ffffff;--sfill:#4a4a4a;--sedge:#ffffff;--bad:#ff8a73;--sel:#4b9cff;--guide:#ff5b8a;--cbg:#1f1f1f;--chk:repeating-conic-gradient(#5a5a5a 0 25%,#3a3a3a 0 50%) 0 0/8px 8px;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--sans);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hl);outline-offset:1px}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg);font-weight:600}
button.pri:hover{border-color:var(--pri);background:#fff}
button:disabled{opacity:.45;cursor:default}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0;width:100%}
input[type=color]{width:28px;height:26px;padding:0 2px;background:var(--bg);border:1px solid var(--line);border-radius:5px;flex:none}
#top{display:flex;align-items:center;gap:6px;padding:0 10px;min-height:38px;background:var(--panel);border-bottom:1px solid var(--line)}
.menus{display:flex;align-items:center;margin-left:8px}.mn{position:relative}
.mt{background:none;border:0;border-radius:4px;padding:4px 9px}.mt:hover,.mn.on .mt{background:var(--panel2)}
.dd{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:40;min-width:210px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.mn.on .dd{display:flex;flex-direction:column}
.dd button{background:none;border:0;border-radius:4px;text-align:left;padding:6px 10px}.dd button:hover{background:#363636}
.dd hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.dd button.cur::before{content:'✓ '}
.brand svg{height:30px;width:auto;display:block}
.ic{display:inline-grid;place-items:center;padding:5px 8px}.ic svg,.ls svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pname{max-width:240px;width:auto;flex:0 1 200px;text-align:left;margin-left:8px;background:transparent;border-color:transparent;color:var(--mute)}#pname:hover,#pname:focus{border-color:var(--line);color:var(--fg)}
.sp{flex:1}
#bExport{padding:4px 14px}
#mid{display:grid;grid-template-columns:240px minmax(0,1fr) 264px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#lay{border-right:1px solid var(--line);display:flex;flex-direction:column}
#inspW{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#insp{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto;background:var(--panel)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.ph button{text-transform:none;letter-spacing:0;font-size:12px;padding:3px 9px}
#layList{flex:1;padding:0 6px 10px;position:relative}
.lr{display:flex;align-items:center;gap:5px;height:28px;padding-right:4px;border-radius:5px;cursor:default;user-select:none;-webkit-user-select:none}
.lr:hover{background:var(--panel2)}.lr.on{background:#2d3a4d}.lr.off .ln,.lr.off .ls{opacity:.45}
.lr .cx,.lr .cx0{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--mute)}
.lr .cx::before{content:'';border:4px solid transparent;border-left:5px solid currentColor;border-right:0;transform:translateX(2px)}.lr .cx.o::before{transform:rotate(90deg) translateX(2px)}
.ls{flex:none;color:var(--mute);display:grid}.ls svg{width:13px;height:13px;stroke-width:1.8}.lr.on .ls{color:var(--fg)}
.ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln input{height:22px;padding:1px 4px}
.lb{background:none;border:0;padding:2px;color:var(--mute);display:none}.lb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.lr:hover .lb,.lb.set{display:block}.lb:hover{color:var(--fg)}
#dropLn{position:absolute;left:6px;right:6px;height:2px;background:var(--sel);pointer-events:none}
#dropLn.in{height:28px;background:transparent;border:2px solid var(--sel);border-radius:5px}
.empty{color:var(--mute);padding:10px 8px;line-height:1.5}

<script>
const $=id=>document.getElementById(id);

let doc={name:'',nodes:[]},ASSETS={};

function reindex(){IDX.clear();const w=(l,p)=>{for(const n of l){IDX.set(n.id,{n,p});if(n.children)w(n.children,n)}};w(doc.nodes,null);sel=sel.map(n=>IDX.get(n.id)?.n).filter(Boolean);if(scope&&!IDX.has(scope))scope=null}

function corners(n){const cx=n.x+n.w/2,cy=n.y+n.h/2,t=(n.rot||0)*Math.PI/180,c=Math.cos(t),s=Math.sin(t);return[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>{const x=a*n.w/2,y=b*n.h/2;return[cx+x*c-y*s,cy+x*s+y*c]})}
function union(bs){bs=bs.filter(Boolean);if(!bs.length)return null;let x=1/0,y=1/0,X=-1/0,Y=-1/0;for(const b of bs){x=Math.min(x,b.x);y=Math.min(y,b.y);X=Math.max(X,b.x+b.w);Y=Math.max(Y,b.y+b.h)}return{x,y,w:X-x,h:Y-y}}
function aabb(n){if(n.type==='bool')return boolGeo(n)?.b||null;if(n.mask&&n.children[0]&&!n.children[0].hid)return aabb(n.children[0]);if(n.dq){const P=n.dq.map(([x,y])=>l2w(n,x,y)),xs=P.map(q=>q[0]),ys=P.map(q=>q[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}if(n.type==='group')return union(n.children.filter(c=>!c.hid).map(aabb));if(!n.rot)return{x:n.x,y:n.y,w:n.w,h:n.h};const p=corners(n),xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}

 const ts=topSel();
 if(editPath){const n=IDX.get(editPath)?.n;if(n){s+=outline(n,1);const sp=(x,y)=>w2s(...l2w(n,x,y)).join(' ');let g0=0;for(const S of subs(n)){const Q=S.pts;for(let i=0;i<Q.length-(S.closed?0:1);i++){const a=Q[i],c=Q[(i+1)%Q.length];s+=`<path class="sg" data-h="s${g0+i}" d="M${sp(a.x,a.y)} C${sp(a.x+a.ox,a.y+a.oy)} ${sp(c.x+c.ix,c.y+c.iy)} ${sp(c.x,c.y)}"/>`}g0+=Q.length}subs(n).flatMap(S=>S.pts).forEach((p,i)=>{const A=w2s(...l2w(n,p.x,p.y));for(const k of['i','o']){const hx=p[k+'x'],hy=p[k+'y'];if(!hx&&!hy)continue;const H=w2s(...l2w(n,p.x+hx,p.y+hy));s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${H[0]}" y2="${H[1]}" stroke="var(--sel)"/>${hs>4?`<circle data-h="${k}${i}" cx="${H[0]}" cy="${H[1]}" r="20" fill="transparent"/>`:''}<circle class="hd" data-h="${k}${i}" cx="${H[0]}" cy="${H[1]}" r="${hs}"/>`}

 else if(distort&&IDX.get(distort)){const n=IDX.get(distort).n,P=n.dq.map(([x,y])=>w2s(...l2w(n,x,y)));s+=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--sel)"/>`;P.forEach((p,i)=>s+=`<rect class="hd" data-h="q${i}" x="${p[0]-hs-1}" y="${p[1]-hs-1}" width="${hs*2+2}" height="${hs*2+2}" style="cursor:move"/>`)}
 else if(ts.length&&!editing&&!pen){
