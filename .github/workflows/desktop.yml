name: Build CocoaCanvas Desktop
on:
  workflow_dispatch:
  push:
    branches: [main, feat/desktop-electron]
    tags: ['desktop-v*']
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CocoaCanvas-standalone.html'
      - 'icon-512.png'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: CocoaCanvas-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish desktop release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/*.exe --title "CocoaCanvas Desktop $tag" --generate-notes --latest
          fi
